name: Release

# Tagging is the trigger, and the tag has to agree with package.json — the
# version in the app's About panel and the version electron-updater compares
# against both come from package.json, so a mismatched tag ships a build that
# lies about what it is.
on:
  push:
    tags: ['v*']
  # Available by hand so a release can be re-cut without moving a tag, which
  # would leave everyone who already downloaded the old one stranded. Choose
  # the tag in the ref picker rather than passing it as an input: the signing
  # environment's tag policy is matched against the run's own ref, so a run
  # dispatched from a branch cannot reach the certificate however it is
  # parameterised. `verify` says so outright rather than leaving that to
  # surface as an environment error two jobs later.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "::error::This workflow builds a tag, but it was run against" \
                 "${{ github.ref_type }} ${{ github.ref_name }}. Re-run it from" \
                 "Actions and choose the release tag in the ref picker."
            exit 1
          fi
          tag="${{ github.ref_name }}"
          package="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$package" ]; then
            echo "::error::Tag $tag does not match package.json ($package)." \
                 "Bump the version in package.json and re-tag, or tag $package instead."
            exit 1
          fi
          echo "version=${package#v}" >> "$GITHUB_OUTPUT"

      # Created here so the build jobs never have to. electron-builder caches
      # its publisher behind an async lookup, so two artifacts finishing at the
      # same moment both miss the cache, both construct a publisher, and both
      # create a draft — the mac build alone produces four (dmg and zip, arm64
      # and x64), so it races itself and splits its artifacts across two
      # releases. Serialising the jobs does not help, because the race is
      # inside one of them. An existing draft is found rather than created, so
      # making it up front is what removes the race.
      - name: Create the draft release the build jobs publish into
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          count=$(gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"$tag\")] | length" | awk '{s+=$1} END {print s+0}')
          if [ "$count" -gt 1 ]; then
            echo "::error::$count releases already exist for $tag, which is the" \
                 "duplicate-draft state this step exists to prevent. Delete all but" \
                 "one in the Releases UI and re-run."
            exit 1
          fi
          if [ "$count" -eq 1 ]; then
            echo "Reusing the existing release for $tag."
            exit 0
          fi
          # HEAD rather than the tag ref: checkout fetches a single commit by
          # default, so the tag object itself may not be in the local repo.
          gh release create "$tag" --draft --title "$tag" \
            --notes "$(git log -1 --pretty=%s HEAD)"

  build:
    needs: verify
    # The signing credentials live on this environment rather than on the
    # repository, so they are reachable only from a job that asks for them by
    # name and only from a ref the environment's tag policy allows. A
    # repository secret is readable by any workflow on any branch, and a
    # Developer ID certificate is not something that can be rotated cheaply.
    # See docs/release.md for the environment's own settings.
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned rather than macos-latest because the icon is an Icon
          # Composer bundle, which electron-builder compiles with `actool` from
          # Xcode 26. macos-26 carries it as the default; a runner label that
          # rolls to something else later would fail the build on the icon, and
          # the error would name actool rather than the rollover.
          - os: macos-26
            script: build:mac
          - os: windows-latest
            script: build:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The same checks CI runs on every pull request. A release build is the
      # worst place to discover a type error.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      # The certificate goes into a keychain this workflow builds, rather than
      # one electron-builder builds from CSC_LINK.
      #
      # electron-builder hands `security set-key-partition-list` the
      # *certificate* password, where that flag takes the *keychain* password
      # (app-builder-lib 26.15.3, codeSign/macCodeSign.js — the keychain's real
      # password is a random string it generates thirty lines earlier). That
      # argument has always been wrong and never mattered, because the keychain
      # it had just created was still unlocked and `security` therefore never
      # consulted it. The macos-26 image moved from macOS 25.5.0 to 25.6.0
      # between v3.0.1 and v3.0.2, the keychain is locked by the time that call
      # runs, the wrong password is finally read, and signing dies on
      # "SecKeychainUnlock: The user name or passphrase you entered is not
      # correct" — with nothing in this repository having changed.
      #
      # With no CSC_LINK in the environment electron-builder skips its own
      # keychain handling and signs against CSC_KEYCHAIN as given (see
      # MacPackager's codeSigningInfo), so the broken call never runs. CSC_LINK
      # has to be *absent* rather than empty: an empty string still counts as
      # set and goes straight back down that path.
      - name: Import the signing certificate into a keychain of our own
        if: runner.os == 'macOS'
        env:
          CERTIFICATE_BASE64: ${{ secrets.MAC_CSC_LINK }}
          CERTIFICATE_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          keychain="$RUNNER_TEMP/arborist-signing.keychain-db"
          certificate="$RUNNER_TEMP/certificate.p12"
          # This protects a keychain that is created here and deleted at the end
          # of the job, so it is generated rather than stored: it is not a
          # secret anybody needs to hold, and it never leaves this step.
          password="$(openssl rand -base64 24)"

          # A base64 .p12 — see the secrets table in docs/release.md. Anything
          # else reaches `security import` as rubbish and is rejected there.
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"

          security create-keychain -p "$password" "$keychain"
          # macOS appends `-db` to a keychain name that does not already end in
          # it, so take whichever path actually appeared rather than assuming
          # which convention this version follows.
          if [ ! -f "$keychain" ] && [ -f "$keychain-db" ]; then
            keychain="$keychain-db"
          fi
          if [ ! -f "$keychain" ]; then
            echo "::error::security create-keychain produced no file at $keychain." \
                 "Signing cannot continue."
            exit 1
          fi
          # No timeout and no lock on sleep. A keychain that locks itself
          # partway through signing is the entire failure this step replaces.
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          rm -f "$certificate"

          # `-k` is the keychain password, which is the argument electron-builder
          # gets wrong. Without this, codesign asks for permission to use the key
          # and waits for a click nobody is there to give.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$password" "$keychain" > /dev/null

          # "Note that filename will not be searched to resolve the signing
          # identity's certificate chain unless it is also on the user's keychain
          # search list." `list-keychains` has no add, only a wholesale set, so
          # the existing entries are read back and passed through — and saved,
          # so the cleanup step can put them back exactly as they were.
          security list-keychains -d user | tr -d '"' | xargs > "$RUNNER_TEMP/keychains-before"
          # Word splitting is deliberate: each entry is a separate argument, and
          # a runner's keychain paths contain no spaces.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(cat "$RUNNER_TEMP/keychains-before")

          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Build, sign and publish a draft release
        run: npm run ${{ matrix.script }} -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No CSC_LINK here, on either platform, and that is load-bearing twice
          # over. On macOS the step above has already put the certificate in a
          # keychain and named it in CSC_KEYCHAIN, which is what electron-builder
          # signs against when CSC_LINK is absent; setting it would send this
          # back down the broken path. On Windows it was never wanted at all —
          # a matrix-wide CSC_LINK handed the Apple certificate to `signtool`,
          # which signed every Windows binary with it, contradicting both
          # electron-builder.yml and the README. See docs/release.md.
          #
          # Notarisation still reads these, and is skipped along with signing
          # when no identity is found — which is what keeps a local
          # `npm run build:mac` working.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # electron-builder skips signing rather than failing when it cannot find
      # an identity, so a green job says nothing about whether the build is
      # signed. Without this step the only evidence is a line in a log nobody
      # reads on the release that goes out unsigned.
      - name: Assert the macOS build is signed
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r app; do
            found=1
            echo "Checking $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            if ! codesign -dvv "$app" 2>&1 | grep -q '^Authority=Developer ID Application'; then
              echo "::error::$app carries no Developer ID Application authority." \
                   "electron-builder signed it ad-hoc or skipped signing, which means" \
                   "MAC_CSC_LINK and MAC_CSC_KEY_PASSWORD did not reach this job." \
                   "Check they are on the 'release' environment rather than the repository."
              exit 1
            fi
            # Notarisation is reported rather than enforced: the ticket is
            # stapled by a separate step of electron-builder's and this check
            # has never been watched failing, so it is not yet trusted to gate
            # a release. Promote it to an error once it has proven itself.
            if xcrun stapler validate "$app" >/dev/null 2>&1; then
              echo "Notarisation ticket stapled to $app"
            else
              echo "::warning::No stapled notarisation ticket on $app." \
                   "Gatekeeper will need a network round trip on first launch," \
                   "and will block the app outright if notarisation did not happen."
            fi
          done < <(find dist -maxdepth 2 -name '*.app' -type d)
          if [ "$found" -eq 0 ]; then
            echo "::error::No .app found under dist/ to check."
            exit 1
          fi

      # The runner is destroyed after this, so this is hygiene rather than a
      # control — but it is the difference between the certificate living for
      # one job and living in a keychain that outlives it, which matters the day
      # any of this runs somewhere self-hosted. `always()` so a failed build
      # still cleans up after itself.
      - name: Remove the signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          # CSC_KEYCHAIN rather than the path spelled out a second time: the
          # import step resolves which name macOS actually gave the file, so
          # this deletes the keychain that was really used or nothing at all.
          if [ -n "${CSC_KEYCHAIN:-}" ]; then
            security delete-keychain "$CSC_KEYCHAIN" || true
          fi
          if [ -f "$RUNNER_TEMP/keychains-before" ]; then
            # shellcheck disable=SC2046
            security list-keychains -d user -s $(cat "$RUNNER_TEMP/keychains-before") || true
          fi
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/keychains-before"

      - name: Upload artifacts for the smoke check
        uses: actions/upload-artifact@v4
        with:
          name: arborist-${{ needs.verify.outputs.version }}-${{ runner.os }}
          # The update manifests go up alongside the installers: they are what
          # electron-updater reads, and a release missing one updates nobody.
          # `*.yml` rather than `latest*.yml` because electron-builder names the
          # manifest after the channel it infers from the version, so a
          # prerelease writes rc.yml and latest*.yml matches nothing.
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.blockmap
            dist/*.yml
          if-no-files-found: error
