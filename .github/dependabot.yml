# Routine version updates. The security side — alerts, and the pull requests
# that fix them — is a repository setting rather than anything in this file,
# and is on.
#
# What this file is really deciding is how reviewable the stream is. A bump
# whose changelog someone has to read gets its own pull request; a bump whose
# changelog nobody was ever going to read gets batched with its neighbours.
# Majors are therefore deliberately left out of every group below.
version: 2
updates:
  # checkout and setup-node, which CI, tag-release and release all share.
  # Grouped: they move together, and CI either passes on the set or it doesn't.
  # Worth keeping current for its own sake and not only for features — these
  # run with the repository's credentials, and release.yml hands them a signing
  # environment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # One package.json at the root: this is a single Electron app, not a
  # workspace, so there is nothing to spread across directories.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # @types/node describes the Node inside Electron, and the Electron major
      # decides which that is — not DefinitelyTyped. A newer types major would
      # typecheck main-process calls against a runtime this app does not ship,
      # and that lands as a runtime error on someone's machine rather than a
      # red CI run. It moves when Electron moves.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

      # Types follow their package; they do not lead it. A @types/js-yaml
      # major is only right once js-yaml itself has moved, and may want
      # deleting rather than bumping if js-yaml starts shipping its own, so it
      # belongs to that migration instead of arriving as a bump of its own.
      - dependency-name: "@types/js-yaml"
        update-types:
          - version-update:semver-major

      # Both scoped to majors rather than ignoring the names outright: ignore
      # conditions suppress security pull requests too, and the note at the
      # top of this file is only true while that path stays open.

    # Split by whether the dependency ships. A bad devDependency breaks the
    # build in front of whoever opened the PR; a bad dependency goes out in a
    # signed release and auto-updates onto people's machines, so the two
    # halves deserve separate looks even when both are only patch bumps.
    # Electron, React and Vite majors are migrations rather than bumps, and
    # arrive on their own by virtue of being excluded here.
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
      prod-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
